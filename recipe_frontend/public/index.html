<!doctype html>
<html lang="en" data-screen="">
  <head>
    <meta charset="utf-8" />
    <title>Recipe Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Inject global Figma tokens first to set variables and resets -->
    <link rel="stylesheet" href="/assets/common.css" data-common-css="true" />
    <!-- Screen CSS: loaded via script gate to only apply on /sign-in before first paint -->
    <script>
      (function(){
        try {
          var path = (window && window.location && window.location.pathname) || '/';
          if (path === '/sign-in') {
            document.documentElement.setAttribute('data-screen', 'sign-in-11-235');
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = '/assets/sign-in-11-235.css';
            link.id = 'link-signin-css';
            document.head.appendChild(link);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
